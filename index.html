<!doctype html>
<html lang="vi" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Kiểm Tra Học Kì I</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .exam-card {
      transition: all 0.3s ease;
    }
    
    .exam-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }
    
    .grade-tab {
      transition: all 0.2s ease;
    }
    
    .grade-tab:hover {
      transform: scale(1.05);
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="w-full h-full overflow-auto"></div>
  <script>
    const examData = [
      // ===== KHỐI 10 – SÁNG =====
      { day: 'Thứ ba', date: '16/12/2025', block: '10', session: 'Sáng', subject: 'Văn', startTime: '07:30', endTime: '09:00', duration: 90 },
      { day: 'Thứ ba', date: '16/12/2025', block: '10', session: 'Sáng', subject: 'Lý', startTime: '09:45', endTime: '10:30', duration: 45 },
      { day: 'Thứ ba', date: '16/12/2025', block: '10', session: 'Sáng', subject: 'Địa', startTime: '09:45', endTime: '10:30', duration: 45 },
      { day: 'Thứ ba', date: '16/12/2025', block: '10', session: 'Sáng', subject: 'Sinh', startTime: '09:45', endTime: '10:30', duration: 45 },
      { day: 'Thứ năm', date: '18/12/2025', block: '10', session: 'Sáng', subject: 'Toán', startTime: '07:30', endTime: '09:00', duration: 90 },
      { day: 'Thứ năm', date: '18/12/2025', block: '10', session: 'Sáng', subject: 'Anh', startTime: '09:45', endTime: '10:45', duration: 60 },
      { day: 'Thứ năm', date: '18/12/2025', block: '10', session: 'Sáng', subject: 'GDKT&PL', startTime: '09:45', endTime: '10:30', duration: 45 },
      { day: 'Thứ sáu', date: '19/12/2025', block: '10', session: 'Sáng', subject: 'Hóa', startTime: '09:15', endTime: '10:00', duration: 45 },
      { day: 'Thứ sáu', date: '19/12/2025', block: '10', session: 'Sáng', subject: 'Sử', startTime: '09:15', endTime: '10:00', duration: 45 },

      // ===== KHỐI 11 – CHIỀU =====
      { day: 'Thứ hai', date: '15/12/2025', block: '11', session: 'Chiều', subject: 'Văn', startTime: '13:30', endTime: '15:00', duration: 90 },
      { day: 'Thứ hai', date: '15/12/2025', block: '11', session: 'Chiều', subject: 'Lý', startTime: '15:45', endTime: '16:30', duration: 45 },
      { day: 'Thứ hai', date: '15/12/2025', block: '11', session: 'Chiều', subject: 'Địa', startTime: '15:45', endTime: '16:30', duration: 45 },
      { day: 'Thứ tư', date: '17/12/2025', block: '11', session: 'Chiều', subject: 'Toán', startTime: '13:30', endTime: '15:00', duration: 90 },
      { day: 'Thứ tư', date: '17/12/2025', block: '11', session: 'Chiều', subject: 'Sinh', startTime: '15:45', endTime: '16:30', duration: 45 },
      { day: 'Thứ tư', date: '17/12/2025', block: '11', session: 'Chiều', subject: 'Sử', startTime: '15:45', endTime: '16:30', duration: 45 },
      { day: 'Thứ sáu', date: '19/12/2025', block: '11', session: 'Chiều', subject: 'Anh', startTime: '13:30', endTime: '14:30', duration: 60 },
      { day: 'Thứ sáu', date: '19/12/2025', block: '11', session: 'Chiều', subject: 'Hóa', startTime: '15:15', endTime: '16:00', duration: 45 },
      { day: 'Thứ sáu', date: '19/12/2025', block: '11', session: 'Chiều', subject: 'GDKT&PL', startTime: '15:15', endTime: '16:00', duration: 45 },

      // ===== KHỐI 12 – SÁNG =====
      { day: 'Thứ hai', date: '15/12/2025', block: '12', session: 'Sáng', subject: 'Văn', startTime: '07:30', endTime: '09:00', duration: 90 },
      { day: 'Thứ hai', date: '15/12/2025', block: '12', session: 'Sáng', subject: 'Hóa', startTime: '09:45', endTime: '10:30', duration: 45 },
      { day: 'Thứ hai', date: '15/12/2025', block: '12', session: 'Sáng', subject: 'Sử', startTime: '09:45', endTime: '10:30', duration: 45 },
      { day: 'Thứ tư', date: '17/12/2025', block: '12', session: 'Sáng', subject: 'Toán', startTime: '07:30', endTime: '09:00', duration: 90 },
      { day: 'Thứ tư', date: '17/12/2025', block: '12', session: 'Sáng', subject: 'Sinh', startTime: '09:45', endTime: '10:30', duration: 45 },
      { day: 'Thứ tư', date: '17/12/2025', block: '12', session: 'Sáng', subject: 'Địa', startTime: '09:45', endTime: '10:30', duration: 45 },
      { day: 'Thứ sáu', date: '19/12/2025', block: '12', session: 'Sáng', subject: 'Anh', startTime: '07:30', endTime: '08:30', duration: 60 },
      { day: 'Thứ sáu', date: '19/12/2025', block: '12', session: 'Sáng', subject: 'Lý', startTime: '09:15', endTime: '10:00', duration: 45 }
    ];

    const defaultConfig = {
      page_title: 'L��ch Kiểm Tra Học Kì I',
      subtitle: 'Năm học 2025-2026',
      background_color: '#f0f9ff',
      header_color: '#3b82f6',
      card_color: '#ffffff',
      accent_color: '#2563eb',
      text_color: '#1e293b',
      font_family: 'Inter',
      font_size: 16
    };

    let currentGrade = '10';
    let filterByDate = 'all';
    let filterBySession = 'all';

    function getSubjectColor(subject) {
      const colors = {
        'Văn': '#ef4444',
        'Toán': '#3b82f6',
        'Anh': '#10b981',
        'Lý': '#8b5cf6',
        'Hóa': '#f59e0b',
        'Sinh': '#06b6d4',
        'Sử': '#ec4899',
        'Địa': '#84cc16',
        'GDKT&PL': '#6366f1'
      };
      return colors[subject] || '#6b7280';
    }

    function groupExamsByDate(exams) {
      const grouped = {};
      exams.forEach(exam => {
        const key = `${exam.date}_${exam.session}`;
        if (!grouped[key]) {
          grouped[key] = {
            day: exam.day,
            date: exam.date,
            session: exam.session,
            exams: []
          };
        }
        grouped[key].exams.push(exam);
      });
      return Object.values(grouped).sort((a, b) => {
        const dateA = a.date.split('/').reverse().join('');
        const dateB = b.date.split('/').reverse().join('');
        if (dateA !== dateB) return dateA.localeCompare(dateB);
        return a.session === 'Sáng' ? -1 : 1;
      });
    }

    async function render() {
      const config = window.elementSdk?.config || defaultConfig;
      const customFont = config.font_family || defaultConfig.font_family;
      const baseFontSize = config.font_size || defaultConfig.font_size;
      const fontStack = `${customFont}, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif`;

      let filteredExams = examData.filter(exam => exam.block === currentGrade);
      
      // Apply filters
      if (filterByDate !== 'all') {
        filteredExams = filteredExams.filter(exam => exam.date === filterByDate);
      }
      if (filterBySession !== 'all') {
        filteredExams = filteredExams.filter(exam => exam.session === filterBySession);
      }
      
      const groupedExams = groupExamsByDate(filteredExams);
      
      // Get unique dates for filter dropdown
      const uniqueDates = [...new Set(examData.filter(exam => exam.block === currentGrade).map(exam => exam.date))].sort((a, b) => {
        const dateA = a.split('/').reverse().join('');
        const dateB = b.split('/').reverse().join('');
        return dateA.localeCompare(dateB);
      });

      document.getElementById('app').innerHTML = `
        <div style="background-color: ${config.background_color || defaultConfig.background_color}; min-height: 100%; font-family: ${fontStack};">
          <header style="background: linear-gradient(135deg, ${config.header_color || defaultConfig.header_color} 0%, #06b6d4 100%); color: white; padding: 48px 24px; text-align: center; border-radius: 0 0 32px 32px; box-shadow: 0 8px 24px rgba(59, 130, 246, 0.2); position: relative;">
            <a href="https://tkbnkhoahung.github.io/tkbnk2526hs/" target="_blank" rel="noopener noreferrer" style="position: absolute; top: 24px; left: 24px; background: rgba(255, 255, 255, 0.2); color: white; padding: 10px 20px; border-radius: 12px; font-weight: 600; font-size: ${baseFontSize * 0.875}px; text-decoration: none; border: 2px solid rgba(255, 255, 255, 0.3); transition: all 0.2s; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 8px;">
              <span style="font-size: ${baseFontSize * 1.25}px;">🏠</span>
              <span>Trang chủ</span>
            </a>
            <h1 style="font-size: ${baseFontSize * 1.75}px; font-weight: 700; margin: 0 0 8px 0; letter-spacing: -0.5px;">${config.page_title || defaultConfig.page_title}</h1>
            <p style="font-size: ${baseFontSize}px; margin: 0; opacity: 0.95; font-weight: 500;">${config.subtitle || defaultConfig.subtitle}</p>
          </header>

          <div style="max-width: 1200px; margin: 0 auto; padding: 24px;">
            <div style="display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;">
              <button class="grade-tab" data-grade="10" style="background: ${currentGrade === '10' ? `linear-gradient(135deg, ${config.accent_color || defaultConfig.accent_color} 0%, #06b6d4 100%)` : (config.card_color || defaultConfig.card_color)}; color: ${currentGrade === '10' ? 'white' : (config.text_color || defaultConfig.text_color)}; padding: 10px 28px; border-radius: 12px; font-weight: 600; font-size: ${baseFontSize * 0.95}px; border: ${currentGrade === '10' ? 'none' : '2px solid #e2e8f0'}; cursor: pointer; box-shadow: ${currentGrade === '10' ? '0 4px 12px rgba(37, 99, 235, 0.3)' : '0 2px 6px rgba(0,0,0,0.05)'}; transition: all 0.2s;">
                Khối 10
              </button>
              <button class="grade-tab" data-grade="11" style="background: ${currentGrade === '11' ? `linear-gradient(135deg, ${config.accent_color || defaultConfig.accent_color} 0%, #06b6d4 100%)` : (config.card_color || defaultConfig.card_color)}; color: ${currentGrade === '11' ? 'white' : (config.text_color || defaultConfig.text_color)}; padding: 10px 28px; border-radius: 12px; font-weight: 600; font-size: ${baseFontSize * 0.95}px; border: ${currentGrade === '11' ? 'none' : '2px solid #e2e8f0'}; cursor: pointer; box-shadow: ${currentGrade === '11' ? '0 4px 12px rgba(37, 99, 235, 0.3)' : '0 2px 6px rgba(0,0,0,0.05)'}; transition: all 0.2s;">
                Khối 11
              </button>
              <button class="grade-tab" data-grade="12" style="background: ${currentGrade === '12' ? `linear-gradient(135deg, ${config.accent_color || defaultConfig.accent_color} 0%, #06b6d4 100%)` : (config.card_color || defaultConfig.card_color)}; color: ${currentGrade === '12' ? 'white' : (config.text_color || defaultConfig.text_color)}; padding: 10px 28px; border-radius: 12px; font-weight: 600; font-size: ${baseFontSize * 0.95}px; border: ${currentGrade === '12' ? 'none' : '2px solid #e2e8f0'}; cursor: pointer; box-shadow: ${currentGrade === '12' ? '0 4px 12px rgba(37, 99, 235, 0.3)' : '0 2px 6px rgba(0,0,0,0.05)'}; transition: all 0.2s;">
                Khối 12
              </button>
            </div>

            <div style="display: flex; justify-content: center; margin-bottom: 24px;">
              <button id="exportBtn" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; padding: 10px 24px; border-radius: 12px; font-weight: 700; font-size: ${baseFontSize * 0.95}px; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); transition: all 0.2s; display: flex; align-items: center; gap: 8px;">
                <span style="font-size: ${baseFontSize * 1.25}px;">📸</span>
                <span>Xuất hình nền Khối ${currentGrade}</span>
              </button>
            </div>

            <!-- Filter Section -->
            <div style="background: ${config.card_color || defaultConfig.card_color}; border-radius: 16px; padding: 16px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;">
              <h3 style="font-size: ${baseFontSize}px; font-weight: 700; color: ${config.text_color || defaultConfig.text_color}; margin: 0 0 12px 0;">🔍 Bộ lọc</h3>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;">
                <div>
                  <label style="display: block; font-size: ${baseFontSize * 0.8}px; font-weight: 600; color: #64748b; margin-bottom: 6px;">Ngày thi</label>
                  <select id="dateFilter" style="width: 100%; padding: 8px 12px; border-radius: 10px; border: 2px solid #e2e8f0; font-size: ${baseFontSize * 0.875}px; color: ${config.text_color || defaultConfig.text_color}; background: white; cursor: pointer; font-family: ${fontStack};">
                    <option value="all">Tất cả ngày</option>
                    ${uniqueDates.map(date => `<option value="${date}" ${filterByDate === date ? 'selected' : ''}>${date}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label style="display: block; font-size: ${baseFontSize * 0.8}px; font-weight: 600; color: #64748b; margin-bottom: 6px;">Buổi</label>
                  <select id="sessionFilter" style="width: 100%; padding: 8px 12px; border-radius: 10px; border: 2px solid #e2e8f0; font-size: ${baseFontSize * 0.875}px; color: ${config.text_color || defaultConfig.text_color}; background: white; cursor: pointer; font-family: ${fontStack};">
                    <option value="all" ${filterBySession === 'all' ? 'selected' : ''}>Tất cả buổi</option>
                    <option value="Sáng" ${filterBySession === 'Sáng' ? 'selected' : ''}>Buổi sáng</option>
                    <option value="Chiều" ${filterBySession === 'Chiều' ? 'selected' : ''}>Buổi chiều</option>
                  </select>
                </div>
              </div>
              <button id="clearFilters" style="margin-top: 12px; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; padding: 7px 18px; border-radius: 10px; font-weight: 600; font-size: ${baseFontSize * 0.8}px; border: none; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 6px rgba(239, 68, 68, 0.3);">
                🗑️ Xóa bộ lọc
              </button>
            </div>

            <!-- Important Notice -->
            <div style="background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border-radius: 16px; padding: 18px; margin-bottom: 24px; box-shadow: 0 3px 10px rgba(251, 191, 36, 0.3); border: 2px solid #fbbf24;">
              <h3 style="font-size: ${baseFontSize * 1.1}px; font-weight: 800; color: #92400e; margin: 0 0 14px 0; display: flex; align-items: center; gap: 8px;">
                <span style="font-size: ${baseFontSize * 1.4}px;">⚠️</span>
                LƯU Ý CHUNG
              </h3>
              <div style="display: grid; gap: 10px;">
                <div style="display: flex; align-items: start; gap: 10px; background: rgba(255, 255, 255, 0.7); padding: 12px; border-radius: 10px;">
                  <span style="font-size: ${baseFontSize * 1.2}px; flex-shrink: 0;">🕐</span>
                  <p style="margin: 0; font-size: ${baseFontSize * 0.9}px; font-weight: 700; color: #78350f; line-height: 1.5;">
                    Học sinh có mặt: <span style="color: #dc2626;">sáng 7h00, chiều 13h00</span>
                  </p>
                </div>
                <div style="display: flex; align-items: start; gap: 10px; background: rgba(255, 255, 255, 0.7); padding: 12px; border-radius: 10px;">
                  <span style="font-size: ${baseFontSize * 1.2}px; flex-shrink: 0;">🚫</span>
                  <p style="margin: 0; font-size: ${baseFontSize * 0.9}px; font-weight: 700; color: #78350f; line-height: 1.5;">
                    Đến sau giờ phát đề <span style="color: #dc2626;">5 phút</span> sẽ <span style="color: #dc2626;">không được vào phòng</span> kiểm tra
                  </p>
                </div>
                <div style="display: flex; align-items: start; gap: 10px; background: rgba(255, 255, 255, 0.7); padding: 12px; border-radius: 10px;">
                  <span style="font-size: ${baseFontSize * 1.2}px; flex-shrink: 0;">✅</span>
                  <p style="margin: 0; font-size: ${baseFontSize * 0.9}px; font-weight: 700; color: #78350f; line-height: 1.5;">
                    Các buổi không kiểm tra, học sinh được nghỉ
                  </p>
                </div>
              </div>
            </div>

            <div style="display: grid; gap: 24px;">
              ${groupedExams.map(group => `
                <div class="exam-card" style="background-color: ${config.card_color || defaultConfig.card_color}; border-radius: 16px; padding: 20px; box-shadow: 0 3px 16px rgba(0,0,0,0.08); border: 1px solid #e2e8f0;">
                  <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 18px;">
                    <div style="width: 4px; height: 40px; background: linear-gradient(135deg, ${config.accent_color || defaultConfig.accent_color} 0%, #06b6d4 100%); border-radius: 4px;"></div>
                    <div style="flex: 1;">
                      <h2 style="font-size: ${baseFontSize * 1.15}px; font-weight: 700; color: ${config.text_color || defaultConfig.text_color}; margin: 0 0 6px 0; letter-spacing: -0.2px;">${group.day}, ${group.date}</h2>
                      <span style="display: inline-block; background: linear-gradient(135deg, ${config.accent_color || defaultConfig.accent_color} 0%, #06b6d4 100%); color: white; padding: 5px 14px; border-radius: 16px; font-size: ${baseFontSize * 0.8}px; font-weight: 600;">${group.session}</span>
                    </div>
                  </div>
                  
                  <div style="display: grid; gap: 14px;">
                    ${group.exams.map(exam => `
                      <div style="display: flex; align-items: center; padding: 16px; background: linear-gradient(135deg, ${getSubjectColor(exam.subject)}08 0%, ${getSubjectColor(exam.subject)}18 100%); border-radius: 14px; border: 2px solid ${getSubjectColor(exam.subject)}40; transition: all 0.3s;">
                        <div style="width: 52px; height: 52px; background: ${getSubjectColor(exam.subject)}; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: ${baseFontSize * 1.3}px; font-weight: 700; color: white; margin-right: 14px; flex-shrink: 0;">
                          ${exam.duration}'
                        </div>
                        <div style="flex: 1; min-width: 0;">
                          <div style="font-size: ${baseFontSize * 1.1}px; font-weight: 700; color: ${config.text_color || defaultConfig.text_color}; margin-bottom: 6px;">${exam.subject}</div>
                          <div style="display: flex; flex-wrap: wrap; gap: 12px; font-size: ${baseFontSize * 1.05}px; color: #475569; font-weight: 600;">
                            <span style="white-space: nowrap;">🕐 ${exam.startTime} - ${exam.endTime}</span>
                            <span style="white-space: nowrap;">⏱ ${exam.duration} phút</span>
                          </div>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
            </div>

            ${groupedExams.length === 0 ? `
              <div style="text-align: center; padding: 48px; color: #6b7280; font-size: ${baseFontSize * 1.125}px;">
                📅 Không có lịch thi phù hợp với bộ lọc
              </div>
            ` : ''}
          </div>
        </div>
      `;

      document.querySelectorAll('.grade-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          currentGrade = btn.dataset.grade;
          filterByDate = 'all';
          filterBySession = 'all';
          render();
        });
      });

      // Filter event listeners
      const dateFilter = document.getElementById('dateFilter');
      const sessionFilter = document.getElementById('sessionFilter');
      const clearFiltersBtn = document.getElementById('clearFilters');

      if (dateFilter) {
        dateFilter.addEventListener('change', (e) => {
          filterByDate = e.target.value;
          render();
        });
      }

      if (sessionFilter) {
        sessionFilter.addEventListener('change', (e) => {
          filterBySession = e.target.value;
          render();
        });
      }

      if (clearFiltersBtn) {
        clearFiltersBtn.addEventListener('click', () => {
          filterByDate = 'all';
          filterBySession = 'all';
          render();
        });
      }

      // Export wallpaper functionality
      const exportBtn = document.getElementById('exportBtn');
      if (exportBtn) {
        exportBtn.addEventListener('click', async () => {
          exportBtn.innerHTML = '<span style="font-size: ' + (baseFontSize * 1.5) + 'px;">��</span><span>��ang tạo hình...</span>';
          exportBtn.style.pointerEvents = 'none';
          
          setTimeout(() => {
            createWallpaper();
          }, 100);
        });
      }

      function createWallpaper() {
        const gradeExams = examData.filter(exam => exam.block === currentGrade);
        const groupedExams = groupExamsByDate(gradeExams);
        
        // Create canvas for mobile wallpaper (1080x1920)
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1080;
        canvas.height = 1920;
        
        // Background gradient
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, config.header_color || defaultConfig.header_color);
        gradient.addColorStop(1, '#06b6d4');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Title section
        ctx.fillStyle = 'white';
        ctx.font = 'bold 72px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(config.page_title || defaultConfig.page_title, canvas.width / 2, 120);
        
        ctx.font = '48px Arial';
        ctx.fillText(config.subtitle || defaultConfig.subtitle, canvas.width / 2, 200);
        
        ctx.font = 'bold 56px Arial';
        ctx.fillText('KHỐI ' + currentGrade, canvas.width / 2, 280);
        
        // Important notices box
        ctx.fillStyle = 'rgba(254, 243, 199, 0.95)';
        ctx.fillRect(60, 340, canvas.width - 120, 280);
        
        ctx.fillStyle = '#92400e';
        ctx.font = 'bold 42px Arial';
        ctx.textAlign = 'left';
        ctx.fillText('⚠️ LƯU Ý QUAN TRỌNG', 100, 400);
        
        ctx.font = '32px Arial';
        ctx.fillText('🕐 Có mặt: Sáng 7h00, Chiều 13h00', 100, 460);
        ctx.fillText('🚫 Trễ 5 phút không được vào phòng', 100, 520);
        ctx.fillText('✅ Buổi không thi được nghỉ', 100, 580);
        
        // Draw exam schedule
        let yPos = 680;
        const cardWidth = canvas.width - 120;
        
        groupedExams.forEach((group, index) => {
          if (yPos > canvas.height - 200) return;
          
          // Date header
          ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.fillRect(60, yPos, cardWidth, 80);
          
          ctx.fillStyle = config.text_color || defaultConfig.text_color;
          ctx.font = 'bold 40px Arial';
          ctx.textAlign = 'left';
          ctx.fillText(`${group.day}, ${group.date} - ${group.session}`, 100, yPos + 52);
          
          yPos += 100;
          
          // Exams
          group.exams.forEach((exam, examIndex) => {
            if (yPos > canvas.height - 100) return;
            
            const subjectColor = getSubjectColor(exam.subject);
            
            // Exam card background
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fillRect(60, yPos, cardWidth, 90);
            
            // Subject color indicator
            ctx.fillStyle = subjectColor;
            ctx.fillRect(60, yPos, 12, 90);
            
            // Subject name
            ctx.fillStyle = config.text_color || defaultConfig.text_color;
            ctx.font = 'bold 38px Arial';
            ctx.fillText(exam.subject, 100, yPos + 42);
            
            // Time and duration
            ctx.font = '30px Arial';
            ctx.fillStyle = '#64748b';
            ctx.fillText(`${exam.startTime} - ${exam.endTime} (${exam.duration}')`, 100, yPos + 75);
            
            yPos += 100;
          });
          
          yPos += 10;
        });
        
        // Footer
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.font = 'bold 32px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🏫 Chúc các em thi tốt!', canvas.width / 2, canvas.height - 60);
        
        // Download image
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `Lich_Thi_Khoi_${currentGrade}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          
          const exportBtn = document.getElementById('exportBtn');
          exportBtn.innerHTML = '<span style="font-size: ' + (baseFontSize * 1.5) + 'px;">✅</span><span>Đã tải xuống!</span>';
          setTimeout(() => {
            exportBtn.innerHTML = '<span style="font-size: ' + (baseFontSize * 1.5) + 'px;">📸</span><span>Xuất hình nền Khối ' + currentGrade + '</span>';
            exportBtn.style.pointerEvents = 'auto';
          }, 2000);
        });
      }
    }

    const api = {
      defaultConfig,
      onConfigChange: render,
      mapToCapabilities: (config) => ({
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => {
              config.background_color = value;
              window.elementSdk.setConfig({ background_color: value });
            }
          },
          {
            get: () => config.card_color || defaultConfig.card_color,
            set: (value) => {
              config.card_color = value;
              window.elementSdk.setConfig({ card_color: value });
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              config.text_color = value;
              window.elementSdk.setConfig({ text_color: value });
            }
          },
          {
            get: () => config.header_color || defaultConfig.header_color,
            set: (value) => {
              config.header_color = value;
              window.elementSdk.setConfig({ header_color: value });
            }
          },
          {
            get: () => config.accent_color || defaultConfig.accent_color,
            set: (value) => {
              config.accent_color = value;
              window.elementSdk.setConfig({ accent_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => {
            config.font_family = value;
            window.elementSdk.setConfig({ font_family: value });
          }
        },
        fontSizeable: {
          get: () => config.font_size || defaultConfig.font_size,
          set: (value) => {
            config.font_size = value;
            window.elementSdk.setConfig({ font_size: value });
          }
        }
      }),
      mapToEditPanelValues: (config) => new Map([
        ['page_title', config.page_title || defaultConfig.page_title],
        ['subtitle', config.subtitle || defaultConfig.subtitle]
      ])
    };

    if (window.elementSdk) {
      window.elementSdk.init(api);
    }

    render();
  </script>
